<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Send Club — Content Manager</title>
  <link rel="icon" href="/assets/send-club-mark.svg" type="image/svg+xml">
</head>
<body>
  <div id="cms-loading" style="font-family:Arial,sans-serif;max-width:620px;margin:12vh auto;padding:24px;color:#222">
    <h2>Loading The Send Club dashboard…</h2>
    <p>If this message stays here, refresh the page after the site finishes deploying.</p>
  </div>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    window.netlifyIdentity = window.netlifyIdentity || [];
    window.netlifyIdentity.on('init', function (user) {
      var hash = window.location.hash || '';
      if (!user && (hash.indexOf('invite_token=') !== -1 || hash.indexOf('recovery_token=') !== -1)) {
        window.netlifyIdentity.open('signup');
      }
    });
    window.netlifyIdentity.on('login', function () {
      window.location.replace('/admin/');
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.8.3/dist/decap-cms.js"></script>
</body>
</html>
